tings:'Settings',welcome:'Learn English with Gigi!',intro:'Choose your explanation language and age group. Then we will find your starting level.',language:'Explanation language',age:'Age group',kids:'Kids · 5–11',teens:'Teens · 12–17',adults:'Adults · 18+',start:'Start level check',resume:'Resume where I left off',continue:'Continue',homeBtn:'Back to home',assessment:'Level check',assessmentInfo:'This short check suggests a starting level; it is not an official CEFR certification.',question:'Question',of:'/',listen:'Listen in English',right:'Correct!',wrong:'Let’s learn together',result:'Suggested starting level',score:'Correct answers',path:'My lesson path',begin:'Go to lessons',retry:'Retake level check',lesson:'Lesson',practice:'Practice',teacher:'Miss Hootie · Teacher',student:'Gigi · Student',learn:'Learn first',goPractice:'Now practise',complete:'Lesson complete!',unlock:'Next lesson unlocked',repeat:'Practise this lesson again',next:'Next lesson',locked:'Finish the previous lesson first',change:'Change age or language',reset:'Reset progress',confirm:'Delete all your progress?',noPlacement:'Complete the level check first.',xp:'Total XP',banana:'Bananas',correctExplain:'Why?',notYet:'Lessons for this level are still being prepared.',notice:'English expressions stay in English; explanations follow your selected language.',placementSaved:'Your result is saved.',practiceAgain:'Try again',levelNote:'This is a short initial assessment. B2–C1 needs more comprehensive testing.',answerFirst:'Choose an answer first.',review:'Read the explanation, then continue when ready.',scoreLesson:'Lesson accuracy',feedbackCorrect:'Great! You used this expression correctly.',feedbackWrong:'Here is the correct answer. Let’s see why.',back:'Back',lessonReady:'Lessons for your level',noHearts:'Mistakes are welcome! Hearts never block learning.'},he:{home:'בית',lessons:'שיעורים',progress:'התקדמות',settings:'הגדרות',welcome:'לומדים אנגלית עם ג׳יג׳י!',intro:'בחרו שפת הסבר וקבוצת גיל. אחר const levels=['A1','A2','B1','B2','C1'];
// All question content is author-reviewed, with age-specific scenarios. Translation applies to prompts and explanations, not target English.
const bank={
kids:[
['A1','Your friend says “Hello!” What can you say?',['Hello!','Goodbye!','Sorry!','Good night!'],0,'Hello! is a greeting you can use when you meet a friend.','Arkadaşın “Hello!” diyor. Nasıl karşılık verirsin?','Hello! arkadaşını gördüğünde kullanabileceğin bir selamlaşmadır.','חבר אומר לך “Hello!”. איך עונים?','Hello! היא ברכת שלום לחבר.'],
['A1','Choose the correct sentence about one cat.',['I has a cat.','I have a cat.','I having a cat.','I haves a cat.'],1,'Use have with I.','Bir kedin olduğunu söyleyen doğru cümleyi seç.','I öznesiyle have kullanılır.','בחרו משפט נכון על חתול אחד.','עם I משתמשים ב-have.'],
['A1','Which word means a colour?',['Jump','Happy','Blue','School'],2,'Blue is a colour.','Hangisi bir renk adıdır?','Blue, mavi renk demektir.','איזו מילה היא צבע?','Blue פירושה כחול.'],
['A2','Yesterday Gigi ___ in the park.',['play','played','plays','playing'],1,'Yesterday signals a finished past action; play becomes played.','Gigi dün parkta ___. Boşluğu doldur.','Yesterday geçmiş zamanı gösterir; play fiili played olur.','אתמול ג׳יג׳י ___ בפארק.','Yesterday מציין עבר; play הופך ל-played.'],
['A2','There ___ three bananas on the table.',['is','are','am','be'],1,'Use are with plural things: three bananas.','Masada üç muz var. Doğru kelimeyi seç.','Üç muz çoğuldur, bu yüzden are kullanılır.','יש שלוש בננות על השולחן.','עם שם עצם ברבים משתמשים ב-are.'],
['A2','Gigi is ___ than her little brother.',['tall','taller','tallest','more tall'],1,'For short adjectives, add -er when comparing two.','Gigi küçük kardeşinden daha uzun. Boşluğu doldur.','İki kişiyi karşılaştırırken tall → taller olur.','ג׳יג׳י גבוהה יותר מאחיה הקטן.','בהשוואה בין שניים tall הופך ל-taller.'],
['B1','If it rains, we ___ inside.',['stay','stayed','will stay','staying'],2,'The first conditional uses if + present, then will + verb.','Yağmur yağarsa içeride kalacağız. Doğru seçeneği bul.','Birinci koşulda if + geniş zaman, ardından will + fiil gelir.','אם ירד גשם, נישאר בפנים.','תנאי ראשון: if + הווה, ואז will + פועל.'],
['B1','I have lived here ___ 2022.',['for','since','during','from'],1,'Since introduces the starting point of a period.','2022’den beri burada yaşıyorum. Boşluğu doldur.','Since başlangıç noktasını belirtir: since 2022.','אני גר כאן מאז 2022.','Since מציין נקודת התחלה.'],
['B1','The cake ___ by my sister yesterday.',['made','was made','is make','has make'],1,'Past passive: was/were + past participle.','Pasta dün kız kardeşim tarafından yapıldı.','Geçmiş zaman edilgende was/were + fiilin üçüncü hâli kullanılır.','העוגה הוכנה אתמול על ידי אחותי.','סביל בעבר: was/were + צורת עבר שלישית.'],
['B2','Hardly had we arrived ___ the show began.',['than','when','that','while'],1,'Hardly ... when describes one event immediately following another.','Biz varır varmaz gösteri başladı. Boşluğu doldur.','Hardly ... when yapısı, hemen ardından gerçekleşen olayı anlatır.','כמעט לא הגענו וכבר המופע התחיל.','במבנה Hardly ... when אירוע אחד קורה מיד אחרי האחר.'],
['B2','She suggested ___ earlier.',['to leave','leave','leaving','left'],2,'Suggest is followed by a gerund here: suggested leaving.','Daha erken ayrılmayı önerdi. Doğru yapıyı seç.','Suggest fiilinden sonra burada -ing biçimi gelir.','היא הציעה לצאת מוקדם יותר.','אחרי suggested משתמשים כאן ב-ing.'],
['B2','Despite ___ tired, Gigi finished the puzzle.',['be','being','was','to be'],1,'Despite takes a noun or -ing form, not a finite clause.','Yorgun olmasına rağmen Gigi bulmacayı bitirdi.','Despite ardından isim veya -ing biçimi gelir.','למרות העייפות ג׳יג׳י סיימה את הפאזל.','אחרי Despite משתמשים בשם עצם או בצורת ing.'],
['C1','Had I known, I ___ you sooner.',['would tell','would have told','told','will tell'],1,'Inverted third conditional: Had I known = If I had known.','Bilseydim sana daha önce söylerdim.','Had I known, If I had known ile aynı koşul yapısıdır; would have + V3 gerekir.','אילו ידעתי, הייתי אומר לך קודם.','Had I known הוא תנאי שלישי הפוך; משתמשים ב-would have + V3.'],
['C1','The new rule is unlikely to ___ much difference.',['do','make','take','give'],1,'Make a difference is the standard collocation.','Yeni kuralın pek fark yaratması beklenmiyor.','Make a difference, fark yaratmak anlamında yerleşik bir kalıptır.','לא סביר שהכלל החדש ישנה הרבה.','הצירוף המקובל הוא make a difference.'],
['C1','No sooner had she spoken ___ everyone laughed.',['when','than','then','while'],1,'No sooner ... than links events in immediate succession.','O konuşur konuşmaz herkes güldü.','No sooner ... than, hemen peş peşe gerçekleşen olayları anlatır.','ברגע שדיברה כולם צחקו.','המבנה הוא No sooner ... than.']
],
teens:[
['A1','A new classmate asks your name. Choose a reply.',['I am fine.','My name is Alex.','I am fifteen years.','I name Alex.'],1,'My name is ... introduces your name.','Yeni sınıf arkadaşın adını soruyor. Doğru yanıtı seç.','My name is ... adını söylemek için kullanılır.','תלמיד חדש שואל לשמך.','My name is ... משמש להצגת השם.'],
['A1','Choose the correct sentence about a phone.',['This is my phone.','This my phone.','This are phone.','These is phone.'],0,'This is + singular noun identifies one thing.','Telefonunu gösteriyorsun. Doğru cümleyi seç.','Tek bir nesne için This is kullanılır.','אתם מראים טלפון. בחרו משפט נכון.','עם חפץ יחיד משתמשים ב-This is.'],
['A1','Which word describes a feeling?',['Notebook','Excited','Window','Monday'],1,'Excited describes a feeling.','Hangisi bir duyguyu anlatır?','Excited heyecanlı anlamına gelir.','איזו מילה מתארת רגש?','Excited פירושה נרגש.'],
['A2','I ___ a message to my friend last night.',['send','sent','sending','sends'],1,'Send is irregular: its past form is sent.','Dün gece arkadaşıma mesaj gönderdim.','Send düzensiz fiildir; geçmiş hâli sent olur.','שלחתי הודעה לחבר אתמול בלילה.','צורת העבר של send היא sent.'],
['A2','She is interested ___ music.',['on','at','in','for'],2,'Interested in is the correct collocation.','O müzikle ilgileniyor. Boşluğu doldur.','Doğru kalıp interested in şeklindedir.','היא מתעניינת במוזיקה.','הצירוף הוא interested in.'],
['A2','This game is ___ than that one.',['interesting','more interesting','most interesting','interestingly'],1,'Long adjectives often use more in comparisons.','Bu oyun diğerinden daha ilginç.','Interesting gibi uzun sıfatlarla karşılaştırmada more kullanılır.','המשחק הזה מעניין יותר מהשני.','עם תארים ארוכים משתמשים ב-more.'],
['B1','If I ___ more time, I would join the club.',['have','had','will have','having'],1,'Second conditional: if + past simple, would + base verb.','Daha çok zamanım olsaydı kulübe katılırdım.','İkinci koşul: if + geçmiş zaman, would + fiil.','אילו היה לי יותר זמן הייתי מצטרף למועדון.','תנאי שני: if + עבר, would + פועל.'],
['B1','I have been studying ___ two hours.',['since','for','from','during'],1,'For describes a duration; since a starting point.','İki saattir ders çalışıyorum.','For süre belirtir: for two hours.','אני לומד כבר שעתיים.','For מציין משך זמן.'],
['B1','The video ___ over a million times.',['has watched','has been watched','have watched','is watching'],1,'Present perfect passive: has been + past participle.','Video bir milyondan fazla kez izlendi.','Present perfect edilgen: has been + fiilin üçüncü hâli.','הסרטון נצפה יותר ממיליון פעמים.','סביל בהווה מושלם: has been + צורה שלישית.'],

function v8Pick(idx){if(v8.selected!==null)return;v8.selected=idx;v8.correct=idx===v8Target(adventures[v8.id]);if(!v8.correct)v8.errors++;playEffect(v8.correct?'correct':'wrong');render();gigiSpeak(v8.correct?'Wonderful! Great job!':'Oopsie! Try again!',v8.correct?1.08:0.94)}
function v8Next(){if(!v8.correct){v8.selected=null;render();return}v8.i++;v8.completed++;v8.selected=null;if(v8.i>=v8Counts[v8Age()]){v8.phase='done';v8Done[v8Age()+'-'+v8.id]=true;localStorage.setItem('gigi_v8_age_done',JSON.stringify(v8Done));playEffect('complete')}else playEffect('tap');gigiSaveGame();render();setTimeout(()=>gigiReadCurrent(),120)}
function v8Game(){if(v8.id<0){let age=v8Age(),count=adventures.filter((a,i)=>v8Done[age+'-'+i]).length;shell(`<div class="card"><h1 class="heading">${ku('adventureHeading')} </h1><div class="notice">🎯 ${age} · ${agePaths[age][state.lang]}</div><p class="sub">${ageDirections[age][state.lang]} · ${v8Counts[age]} ${taskCountLabel()}</p><p class="sub">⭐ ${count}/8 · ${gl('score')}</p>${adventures.map((a,i)=>`<button class="lesson" data-v8start="${i}"><strong>${v8Done[age+'-'+i]?'✅':'🎮'} ${a.title}</strong><div class="sub">${v8Mode(i)==='story'?'📖':v8Mode(i)==='spell'?'🔤':v8Mode(i)==='memory'?'🧠':'🎯'} ${ageGameNames[age]}</div></button>`).join('')}</div>`);document.querySelectorAll('[data-v8start]').forEach(b=>b.onclick=()=>v8Start(+b.dataset.v8start));return}
let a=adventures[v8.id],age=v8Age(),w=a.words[v8Target(a)],mode=v8Mode(v8.id),count=v8Counts[age];let html=`<div class="card"><button class="ghost" id="v8back">${gl('back')}</button><h2 class="heading">${a.title}</h2><p class="sub">${agePaths[age][state.lang]}</p>`;
if(v8.phase==='learn'){let lw=a.words[v8.i];html+=`<div class="card" style="text-align:center"><div style="font-size:65px">${lw[1]}</div>${age==='5-7'?'':`<h2 dir="ltr">${esc(lw[0])}</h2><p>${esc(translatedWord(lw[2]))}</p>`}<p>🦉 Miss Hootie: ${age==='5-7'?'🔊':`“${esc(lw[0])}!”`}</p><p>🐒 Gigi: “${['Wow! I learned something new!','Wait... what? Oh, I see!','Let me try!'][v8.i%3]}”</p></div><p class="sub">${v8.i+1}/${Math.min(a.words.length,a.words.length)}</p><button class="speaker" id="gigiReplay">🔊 ${v8Text('Dinle','Listen','האזנה')}</button><button class="primary" id="v8advance">${gl('next')} →</button>`}
else if(v8.phase==='done'){html+=`<div class="card" style="text-align:center"><div style="font-size:56px">🏆🌟</div><h2>${gl('done')}</h2><p>${v8.completed} ${taskCountLabel()} · ${age}</p><p>🐒 Gigi: “We did it together!”</p></div><button class="primary" id="v8replay">${gl('again')}</button>`}
else {let opts=v8OptionIndices(a),showPicture=age!=='5-7',imageOnly=age==='5-7',intro=v8Prompt(a,mode,w);html+=`<p class="sub">${taskCountLabel()} ${v8.i+1}/${count}</p><div style="height:8px;background:#e8ddf5;border-radius:12px;overflow:hidden"><div style="height:100%;background:#8054c4;width:${Math.round(100*v8.i/count)}%"></div></div><div class="notice"><strong>🦉 Miss Hootie:</strong> ${age==='5-7'?'🔊':esc(intro)}</div><button class="speaker" id="gigiReplay">🔊 ${v8Text('Tekrar dinle','Listen again','האזנה חוזרת')}</button>`;
if(age==='10-11')html+=`<p class="sub">📖 ${ageContext[state.lang][v8.i%3]}</p>`;
if(showPicture)html+=`<div class="card" style="text-align:center;font-size:62px;padding:16px">${w[1]}</div>`;
if(age==='8-9'){
 const letters=[...w[0].toUpperCase().replace(/[^A-Z]/g,'')];
 const shuffled=letters.map((ch,i)=>({ch,i})).sort((x,y)=>((x.i*7+v8.i*11)%17)-((y.i*7+v8.i*11)%17));
 html+=`<div class="notice">🔤 ${v8Text('Resimdeki kelimeyi oluştur','Build the word for the picture','בנו את המילה בתמונה')}</div><div id="gigiSpelled" style="text-align:center;font-size:27px;letter-spacing:6px;min-height:45px;margin:14px">${'_ '.repeat(letters.length)}</div><div class="choices">${shuffled.map(x=>`<button class="choice" style="font-size:25px;min-height:64px" data-letter="${x.ch}">${x.ch}</button>`).join('')}</div><button class="ghost" id="gigiClear">↺</button><div id="gigiWordFeedback" class="notice" style="display:none"></div>`;
 }else if(age==='10-11'){
 const contexts=[`Gigi looks around and says: “I can see a ____!”`,`Miss Hootie asks: “Which word completes our story? We found a ____.”`,`The friends explore together. Gigi whispers: “Look! There is a ____ over there.”`];
 html+=`<div class="notice" dir="ltr">📖 ${contexts[v8.i%3]}</div><div class="choices">${opts.map(i=>`<button class="choice" data-v8pick="${i}">${a.words[i][0]}</button>`).join('')}</div>`;
 }else{

if(age==='5-7')html+=`<div class="choices game-choices">${opts.map(i=>{let x=a.words[i],sel=v8.selected===i;return `<button class="choice ${imageOnly?'visual-choice':''} ${sel?(v8.correct?'correct':'wrong'):''}" data-v8pick="${i}" ${v8.selected!==null?'disabled':''} aria-label="${imageOnly?'Picture '+(opts.indexOf(i)+1):esc(x[0])}" style="${imageOnly?'font-size:44px;min-height:100px':'font-size:16px;min-height:90px'}">${imageOnly?x[1]:`<span dir="ltr">${esc(x[0])}</span>`}</button>`}).join('')}</div>`;
}if(v8.selected!==null)html+=`<div class="notice"><strong>${v8.correct?'✅ '+ku('correct'):'💜 '+ku('wrong')}</strong><p>${v8.correct?`🦉 ${esc(w[0])} = ${esc(translatedWord(w[2]))}`:age==='5-7'?v8Text('Bir daha dene!','Try again!','נסו שוב!'):v8Text('İpucu: Görseli dikkatle incele.','Hint: Look carefully at the picture.','רמז: הסתכלו היטב בתמונה.')}</p><p>🐒 Gigi: “${v8.correct?['Yes! We did it!','I knew we could!','Woohoo!'][v8.i%3]:'Oopsie! Let’s try again!'}”</p><button class="primary" id="v8next">${v8.correct?gl('next'):gl('again')} →</button></div>`;
}
shell(html+'</div>');el('v8back').onclick=()=>{v8.id=-1;render()};if(el('v8advance'))el('v8advance').onclick=v8Advance;if(el('v8next'))el('v8next').onclick=v8Next;if(el('v8replay'))el('v8replay').onclick=()=>v8Start(v8.id);if(el('gigiReplay'))el('gigiReplay').onclick=gigiReadCurrent;document.querySelectorAll('[data-v8pick]').forEach(b=>b.onclick=()=>v8Pick(+b.dataset.v8pick));
if(age==='8-9'&&v8.phase==='play'){
 let typed='';const target=w[0].toUpperCase().replace(/[^A-Z]/g,'');
 document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{
  if(v8.selected!==null)return;
  typed+=b.dataset.letter;b.disabled=true;
  el('gigiSpelled').textContent=typed+' _'.repeat(Math.max(0,target.length-typed.length));
  if(typed.length===target.length){v8.selected=v8Target(a);v8.correct=typed===target; if(!v8.correct)v8.errors++;
   const f=el('gigiWordFeedback');f.style.display='block';f.textContent=v8.correct?'🌟 Great spelling!':'💜 Oopsie! Try again!';
   gigiSpeak(v8.correct?'Great spelling!':'Oopsie! Try again!');
   const next=document.createElement('button');next.className='primary';next.textContent=v8.correct?'Next →':'Try again ↺';next.onclick=()=>{if(v8.correct)v8Next();else{v8.selected=null;render()}};f.appendChild(next);
  }
 });
 if(el('gigiClear'))el('gigiClear').onclick=()=>{v8.selected=null;render()};
}
}
kidsGames=v8Game;

function render(){document.body.classList.toggle('kids-game',state.view==='kidsGames'&&g.id>=0);if(state.view==='kidsGames')kidsGames();else if(state.view==='home')home();else if(state.view==='quiz')quiz();else if(state.view==='assessmentResult')assessmentResult();else if(state.view==='lessons')lessons();else if(state.view==='lessonIntro')lessonIntro();else if(state.view==='lessonResult')lessonResult();else if(state.view==='progress')progress();else if(state.view==='settings')settings();bindKidAge()}
// expose a lightweight smoke-test API, no server required
window.GigiTest={getState:()=>state,ageQuestions,assessmentLevel,questionObj,bank,levels};render();
</script>
<style>
.gigi-book-art{min-height:280px;border-radius:22px;background:linear-gradient(135deg,#dcf6de,#f1e6ff);display:flex;align-items:center;justify-content:center;font-size:clamp(65px,16vw,110px);line-height:1.6;margin:12px 0}
.gigi-book-controls{display:flex;justify-content:center;gap:12px;margin:14px 0}
.gigi-book-controls button{border:0;border-radius:14px;background:#8054c4;color:white;font-size:22px;padding:15px 20px}
.gigi-book-controls button:disabled{opacity:.35}
</style>
<script>
let gigiBookIndex=0,gigiBookPage=0,gigiBookPlaying=false,gigiBookRun=0;
const gigiBooks=[
 {name:"Gigi's First Safari",pages:[
 ["🌞🌴🐒","One sunny morning, Gigi went on a safari. The sky was blue and the sun was warm."],
 ["🦁🌾","A lion roared in the grass. Roar! Hello, lion!"],
 ["🐘🌳","A big elephant waved its long trunk. Hello, elephant!"],
 ["🦒🌿","A tall giraffe reached the leaves. Up, up, up!"],
 ["🦓🌻","A zebra ran across the grass. Look at its beautiful stripes!"],
 ["🐒🍌","Gigi found a yellow banana. Yummy!"],
 ["🐭🍃","A tiny mouse hid under a leaf. The mouse was lost."],
 ["🦜🌴","A colorful parrot flew down. I can help, said the parrot."],
 ["🐢🌺","A friendly turtle showed them the path. Step, step, step."],
 ["🦛🌊","At the river, a hippo splashed in the water. Splash!"],
 ["🐭🏡","They found the little mouse's home. Hooray!"],
 ["🌈🐒🦁🐘","Gigi waved goodbye. What a wonderful safari! The end."]
 ]},
 {name:"The Little Ocean Explorer",pages:[
 ["🌊🐒","Gigi visited the ocean. The water sparkled in the sun."],
 ["🐠🪸","An orange fish swam past a coral reef."],
 ["🐢🌊","A sea turtle glided through the water."],
 ["🐙🫧","An octopus waved its eight arms."],
 ["🦀🏖️","A crab walked sideways across the sand."],
 ["🐬🌊","A dolphin jumped high. Splash!"],
 ["⭐🐚","Gigi spotted a starfish beside a shell."],
 ["🪼💙","A jellyfish floated gently in the blue water."],
 ["🐳🌊","A whale sang a deep song far away."],
 ["🐟🐢🐙","The ocean was full of wonderful friends."],
 ["🌅🐒","The sun began to set. Time to go home."],
 ["🌙🌊","Goodnight, ocean. Sweet dreams. The end."]
 ]},
 {name:"The Rainbow Garden",pages:[
 ["🌞🌱","Gigi found a small garden in the sunshine."],
 ["🌹❤️","A red flower opened. Red!"],
 ["🌼💛","A yellow flower danced. Yellow!"],
 ["🌿💚","The leaves were green. Green!"],
 ["🦋💙","A blue butterfly flew by. Blue!"],
 ["🍊🧡","An orange butterfly landed on a leaf. Orange!"],
 ["🍇💜","Purple flowers grew beside the path. Purple!"],
 ["🌧️☁️","Soft rain began to fall. Pitter, patter!"],
 ["🌱💧","The flowers drank the rain and grew taller."],
 ["🌤️🌈","The sun returned, and a rainbow appeared!"],
 ["🌹🌼🦋","All the colors shone together."],
 ["🐒🌈","Gigi smiled. What a colorful day! The end."]
 ]}
];
function gigiSpeak(message,rate=.85){try{if(!window.speechSynthesis)return false;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(message);u.lang='en-US';u.rate=rate;u.pitch=1.07;speechSynthesis.speak(u);return true}catch(e){return false}}
function gigiReadCurrent(){
 if(state.view!=='kidsGames'||v8.id<0||v8.phase==='done')return;
 const a=adventures[v8.id],w=a.words[v8.phase==='learn'?v8.i:v8Target(a)];
 if(!w)return;
 const line=v8.phase==='learn'?`This is ${/^[aeiou]/i.test(w[0])?'an':'a'} ${w[0]}. ${w[0]}. Say it with me. ${w[0]}.`:`Find the ${w[0]}. Listen carefully. Find the ${w[0]}.`;
 gigiSpeak(line,.78);
}
function gigiSaveGame(){try{localStorage.setItem('gigi_v10_game_'+v8Age()+'_'+v8.id,JSON.stringify({phase:v8.phase,i:v8.i,completed:v8.completed}))}catch(e){}}

const gigiBookTimes=[[0.0, 8.568, 15.101, 21.737, 27.756, 34.048, 38.57, 44.07, 50.715, 57.656, 63.625, 68.679], [0.0, 5.896, 10.27, 14.061, 18.04, 22.411, 26.952, 31.215, 35.67, 39.843, 44.006, 49.357], [0.0, 4.36, 8.372, 12.587, 16.439, 20.995, 26.239, 31.465, 37.119, 41.581, 46.023, 49.571]];
let gigiAudio=null;
function gigiBookStop(){
 gigiBookRun++;gigiBookPlaying=false;
 if(gigiAudio){gigiAudio.pause();gigiAudio.removeAttribute('src');gigiAudio.load();gigiAudio=null}
 try{speechSynthesis.cancel()}catch(e){}
}
function gigiBookList(){
 gigiBookStop();state.view='storybook';
 shell(`<div class="card"><h1 class="heading">📚 Gigi's Storybook World</h1><p class="sub">🎙️ One narrator · automatic page turning</p>${gigiBooks.map((b,i)=>`<button class="lesson" data-book="${i}">📖 ${b.name}</button>`).join('')}</div>`);
 document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>{
 gigiBookIndex=+b.dataset.book;gigiBookPage=0;gigiBookDraw();
 });
}
function gigiBookDraw(){
 const b=gigiBooks[gigiBookIndex],p=b.pages[gigiBookPage],young=v8Age()==='5-7';
 state.view='storybook';
 shell(`<div class="card"><button class="ghost" id="bookBack">← 📚</button><h2>${b.name}</h2><p class="sub">${gigiBookPage+1}/${b.pages.length}</p><div class="gigi-book-art" aria-label="Story picture">${p[0]}</div>${young?'':`<p class="quote" dir="ltr">${p[1]}</p>`}<div class="gigi-book-controls"><button id="bookPrev" ${gigiBookPage===0?'disabled':''}>◀</button><button id="bookSpeak">${gigiBookPlaying?'⏸️':'▶️'}</button><button id="bookNext" ${gigiBookPage===b.pages.length-1?'disabled':''}>▶</button></div><p class="sub" style="text-align:center">${gigiBookPlaying?'🔊 Story playing':'▶️ Tap once to listen to the whole book'}</p></div>`);
 el('bookBack').onclick=()=>gigiBookList();
 el('bookPrev').onclick=()=>gigiBookSeek(Math.max(0,gigiBookPage-1));
 el('bookNext').onclick=()=>gigiBookSeek(Math.min(b.pages.length-1,gigiBookPage+1));
 el('bookSpeak').onclick=()=>{
  if(!gigiAudio){gigiBookPlay()}
  else if(gigiAudio.paused){gigiAudio.play().then(()=>{gigiBookPlaying=true;gigiBookDraw()}).catch(()=>{gigiBookPlaying=false;gigiBookDraw()})}
  else{gigiAudio.pause();gigiBookPlaying=false;gigiBookDraw()}
 };
}
function gigiBookSeek(i){
 gigiBookPage=i;
 if(gigiAudio)gigiAudio.currentTime=gigiBookTimes[gigiBookIndex][i];
 gigiBookDraw();
}
function gigiBookPlay(){
 gigiBookStop();
 const audio=new Audio('story_'+gigiBookIndex+'.wav');
 gigiAudio=audio;
 audio.preload='auto';
 audio.ontimeupdate=()=>{
  if(gigiAudio!==audio)return;
  const times=gigiBookTimes[gigiBookIndex];
  let next=0;
  while(next+1<times.length&&audio.currentTime>=times[next+1])next++;
  if(next!==gigiBookPage){gigiBookPage=next;gigiBookDraw()}
 };
 audio.onended=()=>{if(gigiAudio!==audio)return;gigiBookPlaying=false;gigiBookPage=gigiBooks[gigiBookIndex].pages.length-1;gigiBookDraw()};
 audio.onerror=()=>{if(gigiAudio!==audio)return;gigiBookPlaying=false;gigiBookDraw();alert('Audio could not load. Please check the story WAV files.')};
 audio.play().then(()=>{gigiBookPlaying=true;gigiBookDraw()}).catch(()=>{gigiBookPlaying=false;gigiBookDraw();alert('Tap play again to enable audio.')});
}
const oldGigiRender=render;
render=function(){
 if(state.view==='storybook'){gigiBookList();return}
 oldGigiRender();
 if((state.view==='home'||(state.view==='kidsGames'&&v8.id<0))&&!el('gigiBookOpen')){
   const b=document.createElement('button');b.className='primary';b.id='gigiBookOpen';b.textContent='📚 Gigi’s Storybook World';
   const target=document.querySelector('#app .card');if(target){target.appendChild(b);b.onclick=()=>gigiBookList()}
 }
};

render();
</script>
